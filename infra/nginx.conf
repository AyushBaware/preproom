events {}
http {
  client_max_body_size 5m;
  upstream engine {
    least_conn;
    server host.docker.internal:8081 max_fails=1 fail_timeout=10s;
    server host.docker.internal:8082 max_fails=1 fail_timeout=10s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://engine;
      proxy_read_timeout 120s;
    }
  }
}