spring.application.name=engine

server.port=${PORT:8080}

spring.ai.openai.api-key=${GROQ_API_KEY:not-set}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/preproom}
spring.mongodb.database=preproom

spring.ai.openai.chat.max-completion-tokens=3500
spring.ai.openai.chat.reasoning-effort=low
spring.ai.openai.chat.replay-reasoning-content=false